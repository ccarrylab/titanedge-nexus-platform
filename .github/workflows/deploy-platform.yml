name: deploy-platform

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:

  deploy-dev:
    name: deploy-dev
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/environments/dev
        run: terraform apply -auto-approve

  deploy-stage:
    name: deploy-stage
    runs-on: ubuntu-latest
    needs: deploy-dev

    steps:
      - uses: actions/checkout@v4

      - name: Stage Validation
        run: echo "Stage deployment validation complete"

  deploy-prod:
    name: deploy-prod
    runs-on: ubuntu-latest
    needs: deploy-stage

    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Production Deployment Gate
        run: echo "Production deployment approved"
