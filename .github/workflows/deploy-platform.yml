name: deploy-platform

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          audience: sts.amazonaws.com
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.8.5

      - name: Generate backend.tf
        working-directory: terraform/environments/dev
        run: |
          cat > backend.tf <<BACKEND
          terraform {
            backend "s3" {
              bucket         = "${{ secrets.TF_STATE_BUCKET }}"
              key            = "titanedge-nexus-platform/dev/terraform.tfstate"
              region         = "us-east-1"
              dynamodb_table = "${{ secrets.TF_STATE_LOCK_TABLE }}"
              encrypt        = true
            }
          }
          BACKEND

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/environments/dev
        run: terraform apply -auto-approve

  deploy-stage:
    name: deploy-stage
    runs-on: ubuntu-latest
    needs: deploy-dev
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          audience: sts.amazonaws.com
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.8.5

      - name: Generate backend.tf
        working-directory: terraform/environments/stage
        run: |
          cat > backend.tf <<BACKEND
          terraform {
            backend "s3" {
              bucket         = "${{ secrets.TF_STATE_BUCKET }}"
              key            = "titanedge-nexus-platform/stage/terraform.tfstate"
              region         = "us-east-1"
              dynamodb_table = "${{ secrets.TF_STATE_LOCK_TABLE }}"
              encrypt        = true
            }
          }
          BACKEND

      - name: Terraform Init
        working-directory: terraform/environments/stage
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/environments/stage
        run: terraform apply -auto-approve

  deploy-prod:
    name: deploy-prod
    runs-on: ubuntu-latest
    needs: deploy-stage
    # Requires a "production" GitHub Environment with required reviewers
    # configured in repo settings for this to actually pause for approval.
    environment: production
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          audience: sts.amazonaws.com
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.8.5

      - name: Generate backend.tf
        working-directory: terraform/environments/prod
        run: |
          cat > backend.tf <<BACKEND
          terraform {
            backend "s3" {
              bucket         = "${{ secrets.TF_STATE_BUCKET }}"
              key            = "titanedge-nexus-platform/prod/terraform.tfstate"
              region         = "us-east-1"
              dynamodb_table = "${{ secrets.TF_STATE_LOCK_TABLE }}"
              encrypt        = true
            }
          }
          BACKEND

      - name: Terraform Init
        working-directory: terraform/environments/prod
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/environments/prod
        run: terraform apply -auto-approve
