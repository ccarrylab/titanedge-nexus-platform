name: deploy-platform

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    name: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          audience: sts.amazonaws.com
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Generate backend.tf
        working-directory: terraform/environments/dev
        run: |
          cat > backend.tf <<BACKEND
          terraform {
            backend "s3" {
              bucket         = "${{ secrets.TF_STATE_BUCKET }}"
              key            = "titanedge-nexus-platform/dev/terraform.tfstate"
              region         = "us-east-1"
              encrypt        = true
            }
          }
          BACKEND

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/environments/dev
        run: terraform apply -auto-approve

  deploy-stage:
    name: deploy-stage
    runs-on: ubuntu-latest
    needs: deploy-dev
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          audience: sts.amazonaws.com
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Generate backend.tf
        working-directory: terraform/environments/stage
        run: |
          cat > backend.tf <<BACKEND
          terraform {
            backend "s3" {
              bucket         = "${{ secrets.TF_STATE_BUCKET }}"
              key            = "titanedge-nexus-platform/stage/terraform.tfstate"
              region         = "us-east-1"
              encrypt        = true
            }
          }
          BACKEND

      - name: Terraform Init
        working-directory: terraform/environments/stage
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/environments/stage
        run: terraform apply -auto-approve

  deploy-prod:
    name: deploy-prod
    runs-on: ubuntu-latest
    needs: deploy-stage
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          audience: sts.amazonaws.com
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Generate backend.tf
        working-directory: terraform/environments/prod
        run: |
          cat > backend.tf <<BACKEND
          terraform {
            backend "s3" {
              bucket         = "${{ secrets.TF_STATE_BUCKET }}"
              key            = "titanedge-nexus-platform/prod/terraform.tfstate"
              region         = "us-east-1"
              encrypt        = true
            }
          }
          BACKEND

      - name: Terraform Init
        working-directory: terraform/environments/prod
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform/environments/prod
        run: terraform apply -auto-approve
