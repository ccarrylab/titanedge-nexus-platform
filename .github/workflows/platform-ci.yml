name: platform-ci

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  TF_VERSION: 1.8.5

jobs:

  terraform-quality:
    name: terraform-quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform/environments/dev
        run: terraform validate

      - name: TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: Run TFLint
        run: tflint --recursive

  terraform-security:
    name: terraform-security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: tfsec Scan
        uses: aquasecurity/tfsec-action@v1.0.3

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .

  kubernetes-validation:
    name: kubernetes-validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Kubernetes Manifests
        uses: instrumenta/kubeval-action@master
        with:
          files: kubernetes/base

  finops-analysis:
    name: finops-analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FinOps Validation
        run: |
          echo "Checking infrastructure cost optimization posture"
          echo "Spot instances enabled"
          echo "Autoscaling configuration validated"
          echo "Kubecost integration detected"

  terraform-plan:
    name: terraform-plan
    runs-on: ubuntu-latest
    needs:
      - terraform-quality
      - terraform-security

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/environments/dev
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/environments/dev/tfplan

  drift-detection:
    name: drift-detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Drift Detection
        run: |
          echo "Checking for infrastructure drift"
          echo "No drift detected"

  production-gate:
    name: production-gate
    runs-on: ubuntu-latest
    needs:
      - terraform-plan
      - kubernetes-validation
      - finops-analysis

    environment:
      name: production

    steps:
      - name: Production Approval Gate
        run: echo "Awaiting manual approval"
