name: SBOM Generation

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0.15.8
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom
