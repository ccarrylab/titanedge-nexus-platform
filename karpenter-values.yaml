# clusterName, clusterEndpoint, and the service account's IAM role-arn
# annotation are all passed via --set in install-platform-stack.sh, since
# they're account/cluster-specific and the endpoint changes if the cluster
# is ever recreated. See install-platform-stack.sh for the values.

replicas: 1

controller:
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

webhook:
  enabled: false
