apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-api
  namespace: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atlas-api
  template:
    metadata:
      labels:
        app: atlas-api
    spec:
      containers:
      - name: api
        image: nginx:latest
        ports:
        - containerPort: 80
