apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-api-nginx-config
  namespace: platform
data:
  nginx.conf: |
    worker_processes auto;
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;

      server {
        listen 8080;
        server_name _;

        location /healthz {
          access_log off;
          return 200 "ok\n";
          add_header Content-Type text/plain;
        }

        location / {
          root /usr/share/nginx/html;
          index index.html;
        }
      }
    }
