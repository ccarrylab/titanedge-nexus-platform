apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: atlasrelay-platform
spec:
  project: default

  source:
    repoURL: https://github.com/ccarrylab/titanedge-nexus-platform
    targetRevision: HEAD
    path: kubernetes/base

  destination:
    server: https://kubernetes.default.svc
    namespace: platform

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
